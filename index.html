.list{display:grid;gap:10px;margin-top:12px}
.rowb{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);width:100%;text-align:left;font-weight:600}.rowb small{display:block;font-weight:400;color:var(--ink-2);font-size:12.5px}.rowb .ic{color:var(--ink-2)}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));translate:-50% 20px;opacity:0;background:var(--pill);color:var(--pill-ink);padding:12px 16px;border-radius:16px;font-weight:600;font-size:14px;display:flex;gap:14px;align-items:center;z-index:60;transition:opacity .3s,translate .4s cubic-bezier(.2,.9,.2,1);pointer-events:none;max-width:calc(100% - 32px)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.onb{min-height:calc(100dvh - 24px);display:flex;flex-direction:column;padding-block:12px}
.art{flex:1;position:relative;min-height:330px}
.fc{position:absolute;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:20px;padding:10px 14px 10px 10px;box-shadow:var(--shadow-lg);font-weight:600;font-size:14px;animation:fcIn .9s cubic-bezier(.2,.9,.2,1) backwards,float 6s ease-in-out infinite alternate;overflow:hidden;isolation:isolate}
.fc .tile{width:36px;height:36px;border-radius:12px;background:var(--c)}.fc .tile .ic{width:18px;height:18px}.fc small{display:block;font-weight:500;color:var(--ink-2);font-size:11.5px}

@keyframes fillLoop{from{transform:scaleX(.1)}to{transform:scaleX(.95)}}

@keyframes float{to{translate:0 -12px}}
.fc1{left:2%;top:12%;animation-delay:.3s,1.2s}.fc2{right:0;top:34%;animation-delay:.5s,.4s}.fc3{left:6%;bottom:6%;animation-delay:.7s,2s}

.onb-p{background:var(--surface);border-radius:32px;padding:26px 22px 20px;box-shadow:var(--shadow);display:grid;gap:12px}

.link{font-weight:600;color:var(--ink-2);padding:8px;text-align:center}
body{padding-top:env(safe-area-inset-top,0px)}
html{scroll-behavior:smooth}
#f-u,textarea{font-size:16px}

.bar:hover i{opacity:.85}.bar:active i{scale:1 .97}
.fab{transition:rotate .5s cubic-bezier(.3,1.4,.5,1),scale .25s cubic-bezier(.3,1.6,.5,1)}
.gl-t{display:inline-flex;align-items:center;gap:7px}

.flt{position:fixed;z-index:65;pointer-events:none;font:700 15px var(--disp);background:var(--surface);color:var(--ink);padding:2px 9px;border-radius:99px;box-shadow:var(--shadow);animation:flt .8s cubic-bezier(.2,.8,.2,1) forwards}

.lbl button:disabled{opacity:.4}

/* ===== MOTION ===== */
@media (prefers-reduced-motion:no-preference){

.hl .w>i,.qt .w>i{display:inline-block;font-style:normal;transform-origin:0 100%}
.hl .w>i{animation:wUp .85s var(--out) backwards;animation-delay:calc(var(--w)*85ms + 80ms)}
.nt.act .qt .w>i{animation:wUp .75s var(--out) backwards;animation-delay:calc(var(--w)*48ms + 140ms)}
@keyframes wUp{from{translate:0 115%;rotate:7deg;filter:blur(3px)}}
@keyframes ghIn{from{translate:-30px 0;clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
/* parallax scroll */
.top{translate:0 calc(min(var(--sy,0),260)*.28px)}
.hero::before{top:calc(-80px + min(var(--sy,0),500)*.22px)}
.ring{translate:0 calc(min(var(--sy,0),400)*-.05px);transition:translate .5s var(--spr)}
.hero-t{transition:translate .5s var(--spr);translate:0 calc(min(var(--sy,0),400)*.035px)}
/* dimensionality + parenting + overlay (miring 3D, anak bergerak beda kedalaman, kilau) */

.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.22),transparent 62%);opacity:0;transition:opacity .35s}
.hero.tilt::after{opacity:1}
.nt-in{transition:opacity .45s,scale .45s var(--out),transform .6s var(--spr)}
.nt-in.tilt{transform:perspective(800px) rotateX(calc(var(--ty)*-6deg)) rotateY(calc(var(--tx)*7deg));transition:opacity .45s,scale .45s var(--out),transform .14s linear}
.nt-in .gh,.nt-in .qt,.nt-in .nk,.nt-in .bd{transition:translate .5s var(--spr)}
.nt-in.tilt .gh{translate:calc(var(--tx)*-18px) calc(var(--ty)*-9px)}
.nt-in.tilt .qt,.nt-in.tilt .nk{translate:calc(var(--tx)*6px) calc(var(--ty)*4px)}
.nt-in.tilt .bd{translate:calc(var(--tx)*14px) calc(var(--ty)*7px)}
.nt-in::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.3),transparent 62%);opacity:0;transition:opacity .35s}
.nt-in.tilt::after{opacity:1}
.card.tilt{transform:perspective(700px) rotateX(calc(var(--ty)*-3.2deg)) rotateY(calc(var(--tx)*3.2deg));transition:scale .2s,opacity .3s,translate .45s var(--spr),box-shadow .3s,transform .1s linear}
.fab.mag{translate:calc(var(--tx)*6px) calc(var(--ty)*6px)}
/* dolly & zoom + obscuration: halaman mundur dan mengabur saat sheet terbuka */
.view{transition:scale .6s var(--out),filter .6s,opacity .6s;transform-origin:50% calc(var(--sy,0)*1px + 42vh)}
.scrim{backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);transition:opacity .4s,backdrop-filter .55s,-webkit-backdrop-filter .55s}
.scrim.on{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.view.enter .hero .ring{animation:ringZoom .9s var(--spr) backwards .1s}
@keyframes ringZoom{from{scale:.55;rotate:-40deg;opacity:0}}
/* value change */
.ring-c b{display:inline-block}
.ring-c b.bump{animation:numBump .65s var(--spr)}
@keyframes numBump{35%{scale:1.32;translate:0 -3px}}
.ring::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--hero-ink);opacity:0;pointer-events:none}

}
/* overlay: ganti tema dengan lingkaran yang membuka dari tombol */

::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}

/* ===== IDLE: gerak halus yang jalan terus ===== */
@media (prefers-reduced-motion:no-preference){
/* hero: orbit putus-putus + titik mengitari cincin */

@keyframes floaty{from{translate:0 0}to{translate:0 -3.5px}}

.bar:nth-child(2n){animation-delay:-.9s}.bar:nth-child(3n){animation-delay:-1.8s}.bar:nth-child(5n){animation-delay:-2.4s}

}

function streakOf(h){const T=todayKey();let n=0,d=T;for(let i=0;i<700;i++,d=addDays(d,-1)){if(d<h.created)break;if(!sched(h,d)||skipped(h,d))continue;if(done(h,d))n++;else if(d===T)continue;else break}return n}

const TB=[['late','Terlambat'],['today','Hari ini'],['tom','Besok'],['week','Minggu ini'],['later','Nanti'],['none','Tanpa tenggat'],['done','Selesai']];
const pad2=n=>String(n).padStart(2,'0');
const nowHM=()=>{const n=new Date();return pad2(n.getHours())+':'+pad2(n.getMinutes())};
const courseOf=t=>S.courses.find(c=>c.id===t.course);
const dayDiff=k=>Math.round((fromKey(k)-fromKey(todayKey()))/864e5);
function dueInfo(t){
 if(!t.due)return{b:t.done?'done':'none',txt:'Tanpa tenggat',cls:''};
 const df=dayDiff(t.due),tm=t.time?' · '+t.time:'';let b,txt,cls='';
 if(df<0||(df===0&&t.time&&t.time<nowHM()&&!t.done)){b='late';txt=df<0?(df===-1?'Kemarin':'Terlambat '+(-df)+' hari'):'Lewat jam '+t.time;cls='late'}
 else if(df===0){b='today';txt='Hari ini'+tm;cls='soon'}
 else if(df===1){b='tom';txt='Besok'+tm;cls='soon'}
 else if(df<=7){b='week';txt=fmtD(t.due)+tm}
 else{b='later';const d=fromKey(t.due);txt=d.getDate()+' '+MO[d.getMonth()].slice(0,3)+tm}
 if(t.done){b='done';cls=''}
 return{b,txt,cls}}
const taskSort=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(a.time||'99').localeCompare(b.time||'99')||b.prio-a.prio||a.title.localeCompare(b.title);

 const T=todayKey(),mk=(i,title,c,df,tm,pr,dn)=>({id:'t'+i,title,course:c,due:df==null?'':addDays(T,df),time:tm||'',prio:pr,note:'',done:!!dn,doneAt:dn?Date.now():0});
 S.tasks=[mk(1,'Latihan soal integral bab 4','k1',-1,'',2),mk(2,'Essay: My Future Career','k2',0,'23:59',1),mk(3,'Kerjakan tugas besar landing page','k3',2,'',2),mk(4,'Rangkuman vocabulary unit 6','k2',3,'',0),mk(5,'Kuis turunan parsial','k1',5,'08:00',1),mk(6,'Baca modul JavaScript async','k3',9,'',0),mk(7,'Catatan umum untuk dosen wali',  '',null,'',0),mk(8,'Quiz grammar tenses','k2',-3,'',1,1),mk(9,'Setup repo kelompok','k3',-2,'',0,1)];
 return S.tasks.length}
function rowDue(t,di){return di.b==='late'?di.txt:di.b==='later'?di.txt:t.time&&!t.done?t.time:''}

 const c=courseOf(t),hue=c?c.hue:'navy',di=dueInfo(t),lab=esc(t.title),rd=rowDue(t,di);
 return`<article class="tr ${t.done?'done':''} ${UI.tpop===t.id?'pop':''}" id="t-${t.id}" style="${hs(tn(hue))};--i:${i}" data-act="taskEdit" data-id="${t.id}"><button class="ctl chkc ${t.done?'on':''}" data-act="tt" data-id="${t.id}" aria-pressed="${t.done}" aria-label="${t.done?'Batalkan':'Selesaikan'} ${lab}">${tickSvg}</button><div class="tx"><div class="nm">${lab}</div><div class="sb"><span class="cp">${c?esc(c.name):'Tanpa matkul'}</span>${rd?`<span class="due ${di.cls}">${svg('clock')}${esc(rd)}</span>`:''}</div></div><span class="pr p${t.prio}" aria-hidden="true"><i></i><i></i><i></i></span></article>`}
const stagger=sel=>{if(reduce)return;document.querySelectorAll(sel).forEach((e,i)=>e.animate([{opacity:0,translate:'0 14px',scale:.97},{opacity:1,translate:'0 0',scale:1}],{duration:480,delay:Math.min(i,10)*40,easing:'cubic-bezier(.2,.9,.2,1)',fill:'backwards'}))};
function leaveTask(id){UI.tkt=UI.tkt||{};
 const fin=()=>{if(UI.tk)delete UI.tk[id];delete UI.tkt[id];render();const n=document.getElementById('t-'+id);if(n&&!reduce)n.animate([{opacity:0,translate:'-22px 0',scale:.95},{opacity:1,translate:'0 0',scale:1}],{duration:560,easing:'cubic-bezier(.3,1.45,.5,1)'})};
 const el=document.getElementById('t-'+id);if(!el||reduce||UI.tab!=='task'){fin();return}
 const x=el.parentElement&&el.parentElement.children.length===1?(el.closest('.ag-g')||el):el;
 x.style.height=x.offsetHeight+'px';void x.offsetHeight;x.classList.add('leaving');UI.tkt[id]=setTimeout(fin,430)}
function ghostOut(dir){const old=document.querySelector('.view');if(!old||reduce)return;const r=old.getBoundingClientRect(),g=old.cloneNode(true);
 g.removeAttribute('id');g.classList.remove('enter');g.classList.add('ghost');g.setAttribute('aria-hidden','true');g.inert=true;g.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
 g.style.setProperty('--sy',document.documentElement.style.getPropertyValue('--sy')||'0');g.style.cssText+=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;overflow:hidden;pointer-events:none;z-index:5;margin:0;padding-bottom:0`;
 document.body.appendChild(g);g.animate([{opacity:1,translate:'0 0'},{opacity:0,translate:(-dir*1.6)+'px 0'}],{duration:250,easing:'cubic-bezier(.4,0,.7,1)',fill:'forwards'}).onfinish=()=>g.remove()}
function viewTask(){
 const T=S.tasks,act=T.filter(t=>!t.done),late=act.filter(t=>dueInfo(t).b==='late').length,tod=act.filter(t=>dueInfo(t).b==='today').length,dn=T.length-act.length;
 let out=`<header class="top"><div><p class="hello">Kuliah dan sekolah</p><h1 class="name hl" id="nm-tg">${wd('Tugas')}</h1></div><span class="sq cap" aria-hidden="true">${svg('cap')}</span></header>`;

 /* hero: pil progres */
 const on=T.length?Math.round(10*dn/T.length):0;
 out+=`<section class="tg"><div class="tg-t"><p>Progres tugas</p><div class="tg-n"><b data-num="${dn}">${dn}</b><span>/${T.length}</span></div><small>${late?`<em>${late} terlambat</em> · `:''}${tod?tod+' jatuh tempo hari ini':act.length?act.length+' tugas aktif':'Semua beres'}</small></div><div class="tg-p" aria-hidden="true">${Array.from({length:10},(_,k)=>`<i class="${k<on?'on':''}" style="--k:${k}"></i>`).join('')}</div></section>`;
 /* kotak matkul */
 const f=UI.tf||'aktif',cf=S.courses.some(c=>c.id===UI.tc)||UI.tc==='none'?UI.tc:'all';
 const tile=(id,name,hue,i)=>{const all=T.filter(t=>id==='none'?!courseOf(t):t.course===id),d=all.filter(t=>t.done).length;return`<button class="ct ${cf===id?'sel':''}" style="${hs(tn(hue))};--i:${i};--p:${all.length?(d/all.length).toFixed(3):0}" data-act="tc" data-c="${id}" aria-pressed="${cf===id}"><b data-num="${all.length-d}">${all.length-d}</b><span class="ct-l">${esc(name)}</span><span class="ct-s">${d}/${all.length} selesai</span><i class="ct-b"><i></i></i></button>`};
 const noC=T.some(t=>!courseOf(t));
 out+=`<p class="sect" style="margin-top:20px">Mata kuliah dan pelajaran</p><div class="ct-grid">${S.courses.map((c,i)=>tile(c.id,c.name,c.hue,i)).join('')}${noC?tile('none','Tanpa matkul','navy',S.courses.length):''}<button class="ct add" data-act="courseNew">${svg('plus')}<span>Matkul baru</span></button></div>`;
 if(S.courses.some(c=>c.id===cf))out+=`<button class="link" style="display:block;margin:10px 4px 0" data-act="courseEdit" data-id="${cf}">Ubah atau hapus matkul ini</button>`;
 /* tab garis bawah */
 const pool=T.filter(t=>cf==='all'||(cf==='none'?!courseOf(t):t.course===cf));
 const F=[['aktif','Aktif',pool.filter(t=>!t.done).length],['semua','Semua',pool.length],['selesai','Selesai',pool.filter(t=>t.done).length]];
 out+=`<div class="utabs" style="--i:${F.findIndex(x=>x[0]===f)}" role="tablist">${F.map(x=>`<button class="ut ${f===x[0]?'on':''}" role="tab" aria-selected="${f===x[0]}" data-act="tf" data-f="${x[0]}">${x[1]}<sup>${x[2]}</sup></button>`).join('')}<i class="ut-i"></i></div>`;
 /* agenda berbentuk lini masa */
 const kp=t=>UI.tk&&UI.tk[t.id],show=pool.filter(t=>f==='semua'||kp(t)||(f==='aktif'?!t.done:t.done)),bk=t=>kp(t)?dueInfo({...t,done:!t.done}).b:dueInfo(t).b;
 const G=[],push=(key,big,small,cls,items)=>{if(items.length)G.push({key,big,small,cls,items})};
 push('late','!','LEWAT','late',show.filter(t=>bk(t)==='late').sort(taskSort));
 const dated=show.filter(t=>['today','tom','week'].includes(bk(t))),ds=[...new Set(dated.map(t=>t.due))].sort();
 for(const d of ds){const b=dueInfo({due:d}).b;push('d'+d,fromKey(d).getDate(),b==='today'?'HARI INI':b==='tom'?'BESOK':DAYS[dow(d)].toUpperCase(),b==='today'?'tday':'',dated.filter(t=>t.due===d).sort(taskSort))}
 push('later','…','NANTI','',show.filter(t=>bk(t)==='later').sort(taskSort));
 push('none','–','TANPA','',show.filter(t=>bk(t)==='none').sort(taskSort));
 push('done','✓','SELESAI','ok',show.filter(t=>bk(t)==='done').sort((x,y)=>(y.doneAt||0)-(x.doneAt||0)));
 let idx=0;
 out+=G.length?`<div class="ag">${G.map(g=>`<section class="ag-g ${g.cls}" id="ag-${g.key}"><div class="ag-d"><b>${g.big}</b><small>${g.small}</small></div><div class="ag-l">${g.items.map(t=>taskRow(t,idx++)).join('')}</div></section>`).join('')}</div>`:`<p class="empty" style="padding:22px">${pool.length?(f==='aktif'?'Semua tugas sudah selesai.':'Belum ada tugas yang selesai.'):'Belum ada tugas di sini.'}</p>`;
 return out}

/* ---------- render ---------- */
const tweened=new WeakSet();
function tween(el,a,b){cancelAnimationFrame(el._tw);const t=performance.now(),D=reduce?1:650;(function f(n){const k=Math.min(1,(n-t)/D),e=1-Math.pow(1-k,3);el.textContent=Math.round(a+(b-a)*e);if(k<1)el._tw=requestAnimationFrame(f)})(t);if(!reduce&&a!==b&&el.closest('.ring-c')){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}}
function render(){
 const ui=$('#ui');let inner;
 if(!S.onboarded)inner=viewOnb();
 else{
  let v=UI.tab==='today'?viewToday():UI.tab==='task'?viewTask():UI.tab==='ins'?viewIns():viewProf();
  if(UI.sheet){const h=UI.sheet.id&&hab(UI.sheet.id);if(UI.sheet.type==='detail'&&!h){UI.sheet=null}else UI.sheetHtml=UI.sheet.type==='edit'?sheetEdit():UI.sheet.type==='note'?sheetNote():UI.sheet.type==='task'?sheetTask():UI.sheet.type==='course'?sheetCourse():sheetDetail(h)}
  const on=!!UI.sheet;
  inner=`<main class="view${UI.enter?' enter':''}" id="v-${UI.tab}" style="--dir:${UI.dir}px" ${on?'inert':''}>${v}</main>${navHtml()}<div class="scrim ${on?'on':''}" id="scrim" data-act="closeSheet"></div><section class="sheet ${on?'on':''}" id="sheet" role="dialog" aria-modal="true" tabindex="-1" aria-label="Kebiasaan" ${on?'':'inert aria-hidden="true"'}>${UI.sheetHtml}</section>`}
 document.documentElement.classList.toggle('lock',!!UI.sheet);
 const html=`<div id="ui">${inner}</div>`;
 if(window.morphdom)morphdom(ui,html,{onBeforeNodeDiscarded(n){return !(n.classList&&n.classList.contains('rip'))},onBeforeElUpdated(f,t){if(f.classList&&f.classList.contains('leaving'))return false;if((drag&&f.id==='sheet')||(sw&&sw.on&&f===sw.c))t.setAttribute('style',f.getAttribute('style')||'');if(f.dataset&&f.dataset.num!==undefined&&t.dataset.num!==f.dataset.num){tween(f,+f.dataset.num,+t.dataset.num);f.dataset.num=t.dataset.num;return false}return true}});
 else ui.innerHTML=inner;
 document.querySelectorAll('[data-num]').forEach(el=>{if(!tweened.has(el)){tweened.add(el);tween(el,0,+el.dataset.num)}});
 if(UI.nsync){UI.nsync=false;const t=$('#nt-track');if(t){t.style.scrollBehavior='auto';t.scrollLeft=(UI.ni||0)*t.clientWidth;requestAnimationFrame(()=>{t.style.scrollBehavior=''})}}
 if(UI.enter){clearTimeout(UI.et);UI.et=setTimeout(()=>{UI.enter=false;const m=document.querySelector('.view');m&&m.classList.remove('enter')},1000)}
}
function openSheet(s){clearTimeout(openSheet.t);if(!UI.sheet)UI.lf=document.activeElement;UI.sheet=s;UI.confirm=null;render();requestAnimationFrame(()=>{const e=$('#sheet');e&&e.focus({preventScroll:true})})}
function closeSheet(){if(!UI.sheet)return;UI.sheet=null;UI.confirm=null;render();try{UI.lf&&UI.lf.isConnected&&UI.lf.focus({preventScroll:true})}catch(e){}openSheet.t=setTimeout(()=>{if(!UI.sheet){UI.sheetHtml='';render()}},520)}

const hostTheme=document.documentElement.getAttribute('data-theme');

function applyTheme(){const r=document.documentElement;if(S.theme==='light'||S.theme==='dark')r.setAttribute('data-theme',S.theme);else if(hostTheme)r.setAttribute('data-theme',hostTheme);else r.removeAttribute('data-theme')}

/* ---------- aksi ---------- */
function change(h,d,v){
 const was=done(h,d),b=dayStat(d);setRaw(h,d,v);const a=dayStat(d),now=done(h,d);stamp(h,d,was,now);save();if(!was&&now){UI.pop=h.id;fly(h.id);clearTimeout(UI.pt);UI.pt=setTimeout(()=>{UI.pop=null;const c=document.getElementById('c-'+h.id);c&&c.classList.remove('pop')},800)}render();
 if(!was&&now){hap(18);burstEl(document.querySelector('#c-'+h.id+' .ctl'),h.hue);const s=streakOf(h);if(MILES.includes(s)&&d===todayKey())setTimeout(()=>toast(`${s} hari beruntun: ${h.name}`),350)}
 if(a.t>0&&a.n===a.t&&b.n<b.t)setTimeout(celebrate,260)}
function commitTimer(){const tm=S.timer;if(!tm)return;const h=hab(tm.id);S.timer=null;if(h){const v=Math.min(tgt(h),raw(h,tm.date)+(Date.now()-tm.start)/1000);change(h,tm.date,v)}else save()}
function liveTick(){const tm=S.timer;if(!tm)return;const h=hab(tm.id),el=h&&document.getElementById('c-'+h.id);if(!el||tm.date!==UI.date)return;
 const v=cur(h,tm.date),p=Math.min(1,v/tgt(h)),sp=el.querySelector('.sb span'),rf=el.querySelector('.rgf');
 el.style.setProperty('--p',p.toFixed(3));if(sp)sp.textContent=`${fmtT(v)} / ${h.target} mnt`;if(rf)rf.style.strokeDashoffset=(138.23*(1-p)).toFixed(2)}
let tk=0;
function tickStart(){if(tk)return;tk=setInterval(()=>{if(!S.timer||!S.timer.start){clearInterval(tk);tk=0;return}const h=hab(S.timer.id);if(!h){S.timer=null;save();return}
 if(cur(h,S.timer.date)>=tgt(h)){commitTimer();toast('Timer selesai: '+h.name)}else if(!document.hidden){if(UI.sheet)render();else liveTick()}},1000)}
function timerToggle(h,d){
 if(d!==todayKey()){toast('Timer hanya jalan untuk hari ini. Catat manual lewat detail.');return}
 if(timerOn(h,d)&&S.timer.start){commitTimer();return}
 if(S.timer)commitTimer();
 S.timer={id:h.id,date:d,start:Date.now()};save();tickStart();hap(10);render()}

  save();render();{const sp=document.querySelector('.ut[data-f="selesai"] sup');if(sp){sp.classList.remove('bump');void sp.offsetWidth;sp.classList.add('bump')}}if(t.done&&!S.tasks.some(x=>!x.done))celebrate();return}
 case'tf':UI.tf=el.dataset.f;render();stagger('.ag .ag-g, .ag .tr');return;
 case'tc':UI.tc=UI.tc===el.dataset.c?'all':el.dataset.c;render();return;

 case'courseNew':UI.cd={name:'',hue:HUES[S.courses.length%HUES.length]};openSheet({type:'course'});return;
 case'courseEdit':{const c=S.courses.find(x=>x.id===el.dataset.id);if(c){UI.cd={...c};openSheet({type:'course',id:c.id})}return}

  if(D.id){const c=S.courses.find(x=>x.id===D.id);if(c){c.name=D.name.trim();c.hue=D.hue}}else{const c={id:'k'+Date.now().toString(36),name:D.name.trim(),hue:D.hue};S.courses.push(c);UI.tc=c.id}
  save();closeSheet();toast('Mata kuliah disimpan');return}
 case'courseDel':{const i=S.courses.findIndex(x=>x.id===UI.cd.id);if(i<0)return;const snap=S.courses[i],aff=S.tasks.filter(t=>t.course===snap.id).map(t=>t.id);S.courses.splice(i,1);S.tasks.forEach(t=>{if(t.course===snap.id)t.course=''});if(UI.tc===snap.id)UI.tc='all';save();closeSheet();

 case'noteAdd':UI.nd={kind:'quote',text:'',by:'',hue:HUES[(S.notes||[]).length%HUES.length]};openSheet({type:'note'});return;
 case'noteEdit':{const n=(S.notes||[]).find(x=>x.id===el.dataset.id);if(n){UI.nd={...n};openSheet({type:'note',id:n.id})}return}

 case'noteGo':noteGo(+el.dataset.i);return;
